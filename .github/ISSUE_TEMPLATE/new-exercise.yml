name: Suggest an exercise or topic
description: Propose a concept worth drilling
title: "[topic] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Topics land here when most Databricks engineers hit them regularly. Narrow edge cases don't earn a slot, however interesting.
  - type: input
    id: concept
    attributes:
      label: The concept
      placeholder: Diagnosing and fixing a skewed join
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it deserves a slot
      description: Where does this come up in real work, and how often?
    validations:
      required: true
  - type: textarea
    id: mistake
    attributes:
      label: What mistake would it catch?
      description: The best exercises expose a specific wrong assumption. What does someone get wrong here before they learn it?
  - type: dropdown
    id: area
    attributes:
      label: Best fit
      options:
        - Exercise (5-30 min, single concept)
        - Pipeline lab (2-3 hours, end-to-end project)
        - Deep-dive (1-3 hours, one topic in depth)
        - Not sure
    validations:
      required: true
